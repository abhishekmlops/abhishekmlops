# ──────────────────────────────────────────────────────────────
# Snake Contribution Grid Animation
#
# SETUP INSTRUCTIONS (do this once):
#
#  1. Go to: github.com/abhishekmlops/abhishekmlops
#  2. Create this file at:  .github/workflows/snake.yml
#  3. Go to → Settings → Actions → General
#     Under "Workflow permissions" → select "Read and write permissions"
#     Click Save.
#  4. Go to → Actions tab → "Generate Snake Animation" → Run workflow
#     (first manual run to generate the SVG immediately)
#  5. After ~1 min, an "output" branch will appear with the SVG files.
#  6. The snake will now auto-update every day at midnight UTC.
#
# The README already has the <picture> block that shows the snake.
# Nothing else to configure.
# ──────────────────────────────────────────────────────────────

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at 00:00 UTC
  workflow_dispatch:        # Allows manual trigger from Actions tab

jobs:
  generate:
    name: Generate snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate light + dark snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
